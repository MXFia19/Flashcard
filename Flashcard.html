    <!-- Importation de Babel pour lire le code React -->

</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icônes SVG ---
        const IconEdit = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>;
        const IconBook = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>;
        const IconArrows = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>;
        const IconReset = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
        const IconShuffle = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.8.8 3.6 2.1l2 3.1"/><path d="m22 16-4 4 4 4"/><path d="M15.1 14.9l2.4 3.4c.7 1 1.9 1.7 3.2 1.7H22"/></svg>;
        const IconLeft = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>;
        const IconRight = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>;
        const IconSkip = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>;
        const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;

        // --- Base de données par défaut (Espagnol) ---
        const VOCABULARY_DB = {
            "Fiche 11 : Achats en magasin": [
                { front: "Tienda", back: "Magasin" }, { front: "Centro comercial", back: "Centre commercial" },
                { front: "Boutique", back: "Boutique" }, { front: "Compras", back: "Achats" },
                { front: "Cliente", back: "Client" }, { front: "Dependiente", back: "Vendeur" },
                { front: "Precio", back: "Prix" }, { front: "Descuento", back: "Remise" },
                { front: "Rebajas", back: "Soldes" }, { front: "Cambio", back: "Monnaie (Retour)" },
                { front: "Devolver", back: "Rembourser" }, { front: "Probar", back: "Essayer" },
                { front: "Tarjeta de crédito", back: "Carte de crédit" }, { front: "Dinero en efectivo", back: "Argent liquide" },
                { front: "Bolsa", back: "Sac" }, { front: "Tienda en línea", back: "Boutique en ligne" },
                { front: "Envío", back: "Livraison" }, { front: "Devolución", back: "Retour" }
            ],
            "Fiche 12 : Vêtements et accessoires": [
                { front: "Pantalones", back: "Pantalon" }, { front: "Pantalones cortos", back: "Short" },
                { front: "Vaqueros", back: "Jeans" }, { front: "Vestido", back: "Robe" },
                { front: "Falda", back: "Jupe" }, { front: "Camisa", back: "Chemise" },
                { front: "Camiseta / Niqui", back: "T-shirt" }, { front: "Blusa", back: "Blouse" },
                { front: "Chaqueta", back: "Veste" }, { front: "Abrigo", back: "Manteau" },
                { front: "Traje", back: "Costume" }, { front: "Jersey", back: "Pull" },
                { front: "Suéter", back: "Sweatshirt" }, { front: "Chaleco", back: "Gilet" },
                { front: "Pijama", back: "Pijama" }, { front: "Bata", back: "Robe de nuit" },
                { front: "Un bañador", back: "Maillot de bain" }, { front: "Ropa interior", back: "Sous-vêtements" },
                { front: "Sujetador / Sostén", back: "Soutien-gorge" }, { front: "Braga", back: "Culotte" },
                { front: "Calzoncillo", back: "Caleçon" }, { front: "Bóxer", back: "Boxer" },
                { front: "Zapatos", back: "Chaussures" }, { front: "Zapatos de tacón", back: "Chaussures à talon" },
                { front: "Zapatos de deporte", back: "Baskets" }, { front: "Botas", back: "Bottes" },
                { front: "Zapatillas", back: "Pantoufles" }, { front: "Sandalias", back: "Sandales" },
                { front: "Chanclas", back: "Tongs" }, { front: "Calcetines", back: "Chaussettes" },
                { front: "Sombrero", back: "Chapeau" }, { front: "Guantes", back: "Gants" },
                { front: "Bufanda", back: "Écharpe" }, { front: "Pañuelo", back: "Foulard" },
                { front: "Gorro", back: "Bonnet" }, { front: "Gorra", back: "Casquette" },
                { front: "Corbata", back: "Cravate" }, { front: "Cinturón", back: "Ceinture" },
                { front: "Paraguas", back: "Parapluie" }
            ],
            "Fiche 13 : Couleurs, matières, motifs": [
                { front: "Rojo", back: "Rouge" }, { front: "Azul", back: "Bleu" },
                { front: "Amarillo", back: "Jaune" }, { front: "Verde", back: "Vert" },
                { front: "Negro", back: "Noir" }, { front: "Blanco", back: "Blanc" },
                { front: "Gris", back: "Gris" }, { front: "Naranja", back: "Orange" },
                { front: "Marrón", back: "brun" }, { front: "Rosa", back: "Rose" },
                { front: "Violeta", back: "Violet" }, { front: "Morado / Malva", back: "Mauve" },
                { front: "Celeste", back: "Bleu ciel" }, { front: "Turquesa", back: "Turquoise" },
                { front: "Beige", back: "Beige" }, { front: "Plateado", back: "Argenté" },
                { front: "Dorado", back: "Doré" }, { front: "Burdeos", back: "Bordeaux" },
                { front: "Caqui", back: "Kaki" }, { front: "Fucsia", back: "Fuchsia" },
                { front: "De algodón", back: "En coton" }, { front: "De lana", back: "En laine" },
                { front: "De seda", back: "En soie" }, { front: "De cuero", back: "En cuir" },
                { front: "De piel", back: "En daim" }, { front: "De vaqueros", back: "En jeans" },
                { front: "A rayas", back: "A rayures" }, { front: "A cuadros", back: "A carreaux" },
                { front: "A lunares", back: "A pois" }, { front: "Liso", back: "Uni" }
            ],
            "Fiche 14 & 15 : Aliments & Ustensiles": [
                { front: "pan", back: "pain" }, { front: "la leche", back: "le lait" },
                { front: "la mantequilla", back: "le beurre" }, { front: "queso", back: "fromage" },
                { front: "huevo", back: "oeuf" }, { front: "pollo", back: "poulet" },
                { front: "carne", back: "viande" }, { front: "pescado", back: "poisson" },
                { front: "fruta", back: "fruit" }, { front: "manzana", back: "pomme" },
                { front: "plátano", back: "banane" }, { front: "fresa", back: "fraise" },
                { front: "una verdura", back: "un légume" }, { front: "tomate", back: "tomate" },
                { front: "zanahoria", back: "carotte" }, { front: "lechuga", back: "laitue" },
                { front: "cebolla", back: "oignon" }, { front: "patata", back: "pomme de terre" },
                { front: "pimiento", back: "poivron" }, { front: "arroz", back: "riz" },
                { front: "pastas", back: "pâtes" }, { front: "azúcar", back: "sucre" },
                { front: "sal", back: "sel" }, { front: "pimienta", back: "poivre" },
                { front: "aceite", back: "huile" }, { front: "vinagre", back: "vinaigre" },
                { front: "galletas", back: "biscuits" }, { front: "mermelada", back: "confiture" },
                { front: "chocolate", back: "chocolat" }, { front: "yogurt", back: "yaourt" },
                { front: "el plato", back: "assiette" }, { front: "cuchara", back: "cuillère" },
                { front: "tenedor", back: "fourchette" }, { front: "cuchillo", back: "couteau" },
                { front: "vaso", back: "verre" }, { front: "copa", back: "verre à pied, à vin" },
                { front: "taza", back: "tasse" }, { front: "bol, tazón", back: "bol" },
                { front: "sartén", back: "poêle" }, { front: "cacerola", back: "casserole" },
                { front: "olla", back: "marmite" }, { front: "batidora", back: "mixeur" },
                { front: "mezclar", back: "mélanger" }, { front: "cortar", back: "couper" },
                { front: "añadir", back: "ajouter" }, { front: "cocer", back: "cuire" }
            ]
        };

        const ALL_VOCABULARY = Object.values(VOCABULARY_DB).flat();

        function App() {
            // --- États ---
            const [activeTab, setActiveTab] = useState('play'); // 'play' ou 'create'
            
            // Initialisation des listes personnalisées depuis le localStorage
            const [customLists, setCustomLists] = useState(() => {
                const savedLists = localStorage.getItem('my_flashcard_lists');
                if (savedLists) {
                    try {
                        return JSON.parse(savedLists);
                    } catch (e) {
                        return {};
                    }
                }
                return {};
            }); 

            const [activeCategory, setActiveCategory] = useState("Tout le vocabulaire");
            const [cards, setCards] = useState([...ALL_VOCABULARY]);
            
            // Navigation Flashcards
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [isAnimating, setIsAnimating] = useState(false);
            const [isReversed, setIsReversed] = useState(false);

            const [newListName, setNewListName] = useState("");
            const [rawInput, setRawInput] = useState("");

            // Sauvegarder dans le localStorage à chaque fois que customLists change
            useEffect(() => {
                localStorage.setItem('my_flashcard_lists', JSON.stringify(customLists));
            }, [customLists]);

            // --- Logique Changement de Catégorie ---
            const handleCategoryChange = (e) => {
                const category = e.target.value;
                setActiveCategory(category);
                setIsAnimating(true);
                setIsFlipped(false);
                setIsReversed(false);
                
                setTimeout(() => {
                    if (category === "Tout le vocabulaire") {
                        setCards([...ALL_VOCABULARY]);
                    } else if (VOCABULARY_DB[category]) {
                        setCards([...VOCABULARY_DB[category]]);
                    } else if (customLists[category]) {
                        setCards([...customLists[category]]);
                    }
                    setCurrentIndex(0);
                    setIsAnimating(false);
                }, 150);
            };

            // --- Logique de Création de Liste ---
            const handleCreateList = () => {
                if (!newListName.trim()) {
                    alert("Veuillez donner un nom à votre liste !");
                    return;
                }
                
                const lines = rawInput.split('\n');
                const newCards = [];

                lines.forEach(line => {
                    if (!line.trim()) return;
                    let parts = line.split('\t');
                    if (parts.length < 2) parts = line.split(' - ');
                    if (parts.length < 2) parts = line.split('-');
                    if (parts.length < 2) parts = line.split(':');

                    if (parts.length >= 2) {
                        newCards.push({ front: parts[0].trim(), back: parts[1].trim() });
                    }
                });

                if (newCards.length > 0) {
                    const name = newListName.trim();
                    setCustomLists(prev => ({ ...prev, [name]: newCards }));
                    setActiveCategory(name);
                    setCards([...newCards]);
                    setCurrentIndex(0);
                    setIsFlipped(false);
                    setNewListName("");
                    setRawInput("");
                    setActiveTab('play');
                    alert(`Liste "${name}" sauvegardée localement avec ${newCards.length} mots !`);
                } else {
                    alert("Aucun mot n'a pu être extrait. Vérifiez que vous avez bien mis des tirets (-) entre les mots et leurs définitions.");
                }
            };

            // --- Supprimer une liste personnalisée ---
            const handleDeleteList = () => {
                if (confirm(`Êtes-vous sûr de vouloir supprimer définitivement la liste "${activeCategory}" ?`)) {
                    const newCustomLists = { ...customLists };
                    delete newCustomLists[activeCategory];
                    setCustomLists(newCustomLists);
                    
                    // Retour au vocabulaire par défaut
                    setActiveCategory("Tout le vocabulaire");
                    setCards([...ALL_VOCABULARY]);
                    setCurrentIndex(0);
                    setIsFlipped(false);
                }
            };

            // --- Logique Flashcards ---
            const toggleFlip = () => setIsFlipped(!isFlipped);

            const toggleDirection = () => {
                if (isAnimating) return;
                setIsAnimating(true);
                setIsFlipped(false);
                setTimeout(() => {
                    setIsReversed(!isReversed);
                    setIsAnimating(false);
                }, 150);
            };

            const handleNext = () => {
                if (isAnimating) return;
                setIsAnimating(true);
                setIsFlipped(false);
                setTimeout(() => {
                    setCurrentIndex((prevIndex) => (prevIndex + 1) % cards.length);
                    setIsAnimating(false);
                }, 150);
            };

            const handlePrev = () => {
                if (isAnimating) return;
                setIsAnimating(true);
                setIsFlipped(false);
                setTimeout(() => {
                    setCurrentIndex((prevIndex) => (prevIndex - 1 + cards.length) % cards.length);
                    setIsAnimating(false);
                }, 150);
            };

            const handleSkipToEnd = () => {
                if (isAnimating) return;
                setIsAnimating(true);
                setIsFlipped(false);
                setTimeout(() => {
                    setCards(prevCards => {
                        const newCards = [...prevCards];
                        const currentCard = newCards.splice(currentIndex, 1)[0];
                        newCards.push(currentCard);
                        return newCards;
                    });
                    setCurrentIndex(prevIndex => prevIndex === cards.length - 1 ? 0 : prevIndex);
                    setIsAnimating(false);
                }, 150);
            };

            const handleShuffle = () => {
                if (isAnimating) return;
                setIsAnimating(true);
                setIsFlipped(false);
                setTimeout(() => {
                    const shuffled = [...cards].sort(() => Math.random() - 0.5);
                    setCards(shuffled);
                    setCurrentIndex(0);
                    setIsAnimating(false);
                }, 150);
            };

            const handleReset = () => {
                if (isAnimating) return;
                setIsAnimating(true);
                setIsFlipped(false);
                setTimeout(() => {
                    if (activeCategory === "Tout le vocabulaire") {
                        setCards([...ALL_VOCABULARY]);
                    } else if (VOCABULARY_DB[activeCategory]) {
                        setCards([...VOCABULARY_DB[activeCategory]]);
                    } else if (customLists[activeCategory]) {
                        setCards([...customLists[activeCategory]]);
                    }
                    setCurrentIndex(0);
                    setIsAnimating(false);
                }, 150);
            };

            const currentCard = cards[currentIndex];
            const frontText = isReversed ? currentCard?.back : currentCard?.front;
            const backText = isReversed ? currentCard?.front : currentCard?.back;

            const isSpanishList = activeCategory === "Tout le vocabulaire" || VOCABULARY_DB[activeCategory] !== undefined;
            const isCustomList = customLists[activeCategory] !== undefined;
            const labelRecto = isReversed ? (isSpanishList ? "Français" : "Verso") : (isSpanishList ? "Espagnol" : "Recto");
            const labelVerso = isReversed ? (isSpanishList ? "Espagnol" : "Recto") : (isSpanishList ? "Français" : "Verso");

            return (
                <div className="flex flex-col items-center p-4 max-w-xl mx-auto pt-8">
                    
                    <style dangerouslySetInnerHTML={{__html: `
                        .flashcard-container { perspective: 1000px; }
                        .flashcard-inner {
                            position: relative; width: 100%; height: 100%;
                            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
                            transform-style: preserve-3d;
                        }
                        .flashcard-flipped .flashcard-inner { transform: rotateY(180deg); }
                        .flashcard-front, .flashcard-back {
                            position: absolute; width: 100%; height: 100%;
                            -webkit-backface-visibility: hidden; backface-visibility: hidden;
                            border-radius: 1.5rem;
                            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
                            display: flex; flex-direction: column; align-items: center; justify-content: center;
                            padding: 2rem; text-align: center; cursor: pointer;
                        }
                        .flashcard-front { background-color: white; border: 2px solid #e2e8f0; }
                        .flashcard-back { background-color: #f8fafc; border: 2px solid #cbd5e1; transform: rotateY(180deg); }
                        select { 
                            appearance: none; 
                            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%234f46e5%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); 
                            background-repeat: no-repeat; background-position: right .7rem top 50%; background-size: .65rem auto; 
                        }
                    `}} />

                    {/* Onglets de navigation */}
                    <div className="flex w-full bg-white rounded-full p-1 shadow-sm border border-slate-200 mb-6">
                        <button 
                            onClick={() => setActiveTab('play')}
                            className={`flex-1 flex items-center justify-center gap-2 py-3 rounded-full font-semibold transition-all ${activeTab === 'play' ? 'bg-indigo-600 text-white shadow' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-50'}`}
                        >
                            <IconBook /> Réviser
                        </button>
                        <button 
                            onClick={() => setActiveTab('create')}
                            className={`flex-1 flex items-center justify-center gap-2 py-3 rounded-full font-semibold transition-all ${activeTab === 'create' ? 'bg-indigo-600 text-white shadow' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-50'}`}
                        >
                            <IconEdit /> Créer une liste
                        </button>
                    </div>

                    {/* VUE 1 : RÉVISION */}
                    {activeTab === 'play' && (
                        <div className="w-full animate-in fade-in duration-300">
                            
                            {/* Menu de sélection de catégorie avec bouton supprimer si liste custom */}
                            <div className="mb-6 w-full flex gap-2">
                                <select 
                                    value={activeCategory}
                                    onChange={handleCategoryChange}
                                    className="block w-full pl-4 pr-10 py-3 text-base border-slate-200 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-2xl bg-white shadow-sm text-indigo-900 font-semibold cursor-pointer"
                                >
                                    <optgroup label="Listes d'Espagnol">
                                        <option value="Tout le vocabulaire">📚 Tout le vocabulaire ({ALL_VOCABULARY.length} mots)</option>
                                        {Object.keys(VOCABULARY_DB).map(cat => (
                                            <option key={cat} value={cat}>{cat} ({VOCABULARY_DB[cat].length} mots)</option>
                                        ))}
                                    </optgroup>
                                    
                                    {Object.keys(customLists).length > 0 && (
                                        <optgroup label="Mes Listes Sauvegardées">
                                            {Object.keys(customLists).map(cat => (
                                                <option key={cat} value={cat}>💾 {cat} ({customLists[cat].length} mots)</option>
                                            ))}
                                        </optgroup>
                                    )}
                                </select>
                                
                                {isCustomList && (
                                    <button 
                                        onClick={handleDeleteList}
                                        className="p-3 bg-red-50 text-red-600 hover:bg-red-100 rounded-2xl shadow-sm transition-colors"
                                        title="Supprimer cette liste"
                                    >
                                        <IconTrash />
                                    </button>
                                )}
                            </div>

                            {/* Contrôles du haut */}
                            <div className="flex justify-between items-center mb-4 px-2">
                                <button
                                    onClick={toggleDirection}
                                    className="flex items-center gap-1 px-3 py-2 bg-slate-200 text-slate-700 rounded-full shadow-sm hover:bg-slate-300 transition-colors font-semibold text-sm"
                                >
                                    <span>{labelRecto}</span>
                                    <IconArrows />
                                    <span>{labelVerso}</span>
                                </button>
                                
                                <div className="flex gap-2">
                                    <button onClick={handleReset} className="p-2 bg-white rounded-full shadow-sm hover:bg-slate-100 transition-colors text-slate-600" title="Ordre original">
                                        <IconReset />
                                    </button>
                                    <button onClick={handleShuffle} className="p-2 bg-indigo-500 text-white rounded-full shadow-sm hover:bg-indigo-600 transition-colors" title="Mélanger les cartes">
                                        <IconShuffle />
                                    </button>
                                </div>
                            </div>

                            {/* La carte */}
                            <div className="flashcard-container h-80 w-full mb-8">
                                <div className={`flashcard ${isFlipped ? 'flashcard-flipped' : ''} w-full h-full`} onClick={toggleFlip}>
                                    <div className="flashcard-inner">
                                        <div className="flashcard-front">
                                            <span className="absolute top-4 right-5 text-sm font-medium text-slate-400">{labelRecto}</span>
                                            <p className="text-3xl md:text-4xl font-bold text-slate-800 leading-tight px-4">{frontText}</p>
                                            <p className="absolute bottom-6 text-sm text-slate-400 flex items-center gap-1">
                                                <IconReset /> Cliquez pour retourner
                                            </p>
                                        </div>
                                        <div className="flashcard-back">
                                            <span className="absolute top-4 right-5 text-sm font-medium text-indigo-400">{labelVerso}</span>
                                            <p className="text-3xl md:text-4xl font-bold text-indigo-600 leading-tight px-4">{backText}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Contrôles de navigation */}
                            <div className="flex flex-col gap-3">
                                <div className="flex items-center justify-between bg-white p-2 rounded-2xl shadow-sm border border-slate-200">
                                    <button onClick={handlePrev} disabled={isAnimating} className="flex items-center gap-2 px-4 py-3 text-slate-600 hover:text-indigo-700 hover:bg-indigo-50 rounded-xl transition-colors font-medium disabled:opacity-50">
                                        <IconLeft />
                                        <span className="hidden sm:inline">Précédent</span>
                                    </button>
                                    
                                    <div className="text-sm font-semibold text-slate-500">
                                        {currentIndex + 1} / {cards.length}
                                    </div>

                                    <button onClick={handleNext} disabled={isAnimating} className="flex items-center gap-2 px-4 py-3 text-slate-600 hover:text-indigo-700 hover:bg-indigo-50 rounded-xl transition-colors font-medium disabled:opacity-50">
                                        <span className="hidden sm:inline">Suivant</span>
                                        <IconRight />
                                    </button>
                                </div>

                                <button onClick={handleSkipToEnd} disabled={isAnimating} className="flex items-center justify-center gap-2 px-4 py-3 bg-white text-slate-600 hover:text-amber-600 hover:bg-amber-50 rounded-2xl shadow-sm border border-slate-200 hover:border-amber-200 transition-all font-medium disabled:opacity-50 w-full">
                                    <IconSkip />
                                    Passer et mettre à la fin
                                </button>
                            </div>
                        </div>
                    )}

                    {/* VUE 2 : CRÉATION */}
                    {activeTab === 'create' && (
                        <div className="w-full flex flex-col gap-4 animate-in fade-in duration-300">
                            <div className="bg-blue-50 text-blue-800 p-4 rounded-2xl text-sm leading-relaxed border border-blue-100">
                                <strong>Comment créer votre liste ?</strong><br/>
                                Copiez-collez votre vocabulaire ci-dessous (un mot par ligne). Séparez le terme et la traduction par un <b>tiret (-)</b>.<br/>
                                <i>⚠️ Les listes sont sauvegardées sur <b>cet appareil</b> spécifiquement.</i>
                            </div>
                            
                            <input 
                                type="text"
                                value={newListName}
                                onChange={(e) => setNewListName(e.target.value)}
                                placeholder="Nom de la liste (ex: Verbes Irréguliers)"
                                className="w-full p-4 rounded-2xl border-2 border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 outline-none font-bold text-slate-700"
                            />

                            <textarea 
                                value={rawInput}
                                onChange={(e) => setRawInput(e.target.value)}
                                className="w-full h-64 p-4 rounded-2xl border-2 border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 outline-none resize-y font-mono text-sm"
                                placeholder="Apple - Pomme&#10;Dog - Chien&#10;Cat - Chat"
                            ></textarea>

                            <button 
                                onClick={handleCreateList}
                                className="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold text-lg shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2"
                            >
                                <IconEdit /> Créer et Sauvegarder
                            </button>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
