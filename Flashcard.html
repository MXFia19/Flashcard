<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyglot App - Mes Flashcards</title>
    
    <!-- Importation de Tailwind CSS pour le style -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // Active le dark mode via la classe 'dark'
            theme: {
                extend: {
                    colors: { brand: { 500: '#6366f1', 600: '#4f46e5' } }
                }
            }
        }
    </script>
    
    <!-- Importation de React -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Importation de Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { -webkit-backface-visibility: hidden; backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .card-transition { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
        /* Cacher la scrollbar mais garder le scroll */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 transition-colors duration-300 dark:bg-slate-900 dark:text-slate-100 font-sans antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- ICÔNES SVG ---
        const Icons = {
            Moon: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>,
            Sun: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>,
            Volume: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>,
            Cards: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="8" x2="16" y1="10" y2="10"/><path d="M20 6h-4"/></svg>,
            List: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg>,
            Grid: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>,
            Keyboard: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 8h.01"/><path d="M12 12h.01"/><path d="M14 8h.01"/><path d="M16 12h.01"/><path d="M18 8h.01"/><path d="M6 8h.01"/><path d="M7 16h10"/><path d="M8 12h.01"/><rect width="20" height="16" x="2" y="4" rx="2"/></svg>,
            Edit: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
            Check: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>,
            X: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            Rotate: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        };

        // --- BD ESPAGNOL PAR DÉFAUT ---
        const VOCABULARY_DB = {
            "Fiche 11 : Achats en magasin": [
                { front: "Tienda", back: "Magasin" }, { front: "Centro comercial", back: "Centre commercial" },
                { front: "Boutique", back: "Boutique" }, { front: "Compras", back: "Achats" },
                { front: "Cliente", back: "Client" }, { front: "Dependiente", back: "Vendeur" },
                { front: "Precio", back: "Prix" }, { front: "Descuento", back: "Remise" },
                { front: "Rebajas", back: "Soldes" }, { front: "Cambio", back: "Monnaie (Retour)" },
                { front: "Devolver", back: "Rembourser" }, { front: "Probar", back: "Essayer" },
                { front: "Tarjeta de crédito", back: "Carte de crédit" }, { front: "Dinero en efectivo", back: "Argent liquide" },
                { front: "Bolsa", back: "Sac" }
            ],
            "Fiche 12 : Vêtements": [
                { front: "Pantalones", back: "Pantalon" }, { front: "Vaqueros", back: "Jeans" },
                { front: "Vestido", back: "Robe" }, { front: "Falda", back: "Jupe" },
                { front: "Camisa", back: "Chemise" }, { front: "Camiseta", back: "T-shirt" },
                { front: "Chaqueta", back: "Veste" }, { front: "Abrigo", back: "Manteau" },
                { front: "Zapatos", back: "Chaussures" }, { front: "Sombrero", back: "Chapeau" }
            ],
            "Fiche 13 : Couleurs & Matières": [
                { front: "Rojo", back: "Rouge" }, { front: "Azul", back: "Bleu" },
                { front: "Amarillo", back: "Jaune" }, { front: "Verde", back: "Vert" },
                { front: "Negro", back: "Noir" }, { front: "Blanco", back: "Blanc" },
                { front: "Gris", back: "Gris" }, { front: "De algodón", back: "En coton" },
                { front: "De cuero", back: "En cuir" }, { front: "A rayas", back: "A rayures" }
            ]
        };

        const ALL_VOCABULARY = Object.values(VOCABULARY_DB).flat();

        // ==========================================
        // COMPOSANTS DES MODES DE JEU
        // ==========================================

        // 1. FLASHCARDS INTELLIGENTES
        const FlashcardMode = ({ cards, isReversed, onPlayAudio }) => {
            const [queue, setQueue] = useState([...cards].sort(() => Math.random() - 0.5));
            const [missed, setMissed] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [finished, setFinished] = useState(false);

            const handleAnswer = (knewIt) => {
                setIsFlipped(false);
                setTimeout(() => {
                    if (!knewIt) {
                        setMissed([...missed, queue[currentIndex]]);
                    }
                    if (currentIndex + 1 < queue.length) {
                        setCurrentIndex(currentIndex + 1);
                    } else {
                        setFinished(true);
                    }
                }, 200);
            };

            const retryMissed = () => {
                setQueue([...missed].sort(() => Math.random() - 0.5));
                setMissed([]);
                setCurrentIndex(0);
                setFinished(false);
            };

            const restartAll = () => {
                setQueue([...cards].sort(() => Math.random() - 0.5));
                setMissed([]);
                setCurrentIndex(0);
                setFinished(false);
            };

            if (finished) {
                const score = queue.length - missed.length;
                return (
                    <div className="text-center p-8 bg-white dark:bg-slate-800 rounded-3xl shadow-lg mt-8 border border-slate-100 dark:border-slate-700">
                        <h2 className="text-3xl font-bold mb-4">Terminé ! 🎉</h2>
                        <p className="text-xl mb-6">Ton score : <span className="font-bold text-brand-600 dark:text-brand-400">{score} / {queue.length}</span></p>
                        {missed.length > 0 ? (
                            <button onClick={retryMissed} className="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-bold mb-3 shadow-md">
                                Réviser mes {missed.length} erreurs 🔄
                            </button>
                        ) : (
                            <p className="text-green-500 font-bold mb-6">Parfait ! Aucune erreur. 🌟</p>
                        )}
                        <button onClick={restartAll} className="w-full py-3 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 rounded-xl font-bold">
                            Tout recommencer
                        </button>
                    </div>
                );
            }

            const currentCard = queue[currentIndex];
            const frontText = isReversed ? currentCard.back : currentCard.front;
            const backText = isReversed ? currentCard.front : currentCard.back;

            return (
                <div className="w-full mt-4 flex flex-col items-center">
                    <p className="text-slate-500 dark:text-slate-400 mb-4 font-medium">Carte {currentIndex + 1} sur {queue.length}</p>
                    
                    <div className="perspective-1000 w-full h-80 mb-8 cursor-pointer" onClick={() => setIsFlipped(!isFlipped)}>
                        <div className={`relative w-full h-full card-transition transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                            
                            {/* Recto */}
                            <div className="absolute w-full h-full backface-hidden bg-white dark:bg-slate-800 rounded-3xl shadow-xl border-2 border-slate-100 dark:border-slate-700 flex flex-col items-center justify-center p-6 text-center">
                                <button onClick={(e) => { e.stopPropagation(); onPlayAudio(frontText, isReversed ? 'fr' : 'es'); }} className="absolute top-4 left-4 p-2 text-slate-400 hover:text-brand-500 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition"><Icons.Volume/></button>
                                <span className="absolute top-5 right-5 text-sm font-bold text-slate-300 dark:text-slate-500">{isReversed ? 'FR' : 'ES'}</span>
                                <h2 className="text-4xl sm:text-5xl font-bold text-slate-800 dark:text-white leading-tight">{frontText}</h2>
                                <p className="absolute bottom-6 text-sm text-slate-400 flex items-center gap-1"><Icons.Rotate /> Tapoter pour voir la réponse</p>
                            </div>

                            {/* Verso */}
                            <div className="absolute w-full h-full backface-hidden bg-brand-50 dark:bg-brand-900/30 rounded-3xl shadow-xl border-2 border-brand-200 dark:border-brand-700 flex flex-col items-center justify-center p-6 text-center rotate-y-180">
                                <button onClick={(e) => { e.stopPropagation(); onPlayAudio(backText, isReversed ? 'es' : 'fr'); }} className="absolute top-4 left-4 p-2 text-brand-400 hover:text-brand-600 rounded-full hover:bg-brand-100 dark:hover:bg-slate-700 transition"><Icons.Volume/></button>
                                <span className="absolute top-5 right-5 text-sm font-bold text-brand-300 dark:text-brand-700">{isReversed ? 'ES' : 'FR'}</span>
                                <h2 className="text-4xl sm:text-5xl font-bold text-brand-700 dark:text-brand-300 leading-tight">{backText}</h2>
                            </div>
                        </div>
                    </div>

                    {isFlipped ? (
                        <div className="flex gap-4 w-full">
                            <button onClick={() => handleAnswer(false)} className="flex-1 py-4 bg-red-100 hover:bg-red-200 dark:bg-red-900/50 dark:hover:bg-red-900 text-red-700 dark:text-red-200 rounded-2xl font-bold text-lg flex justify-center items-center gap-2 transition"><Icons.X/> J'ai faux</button>
                            <button onClick={() => handleAnswer(true)} className="flex-1 py-4 bg-green-100 hover:bg-green-200 dark:bg-green-900/50 dark:hover:bg-green-900 text-green-700 dark:text-green-200 rounded-2xl font-bold text-lg flex justify-center items-center gap-2 transition"><Icons.Check/> J'ai bon</button>
                        </div>
                    ) : (
                        <div className="h-16"></div> /* Espaceur pour éviter que les boutons sautent */
                    )}
                </div>
            );
        };

        // 2. QCM (Choix multiples)
        const QcmMode = ({ cards, isReversed, onPlayAudio }) => {
            const [queue, setQueue] = useState([...cards].sort(() => Math.random() - 0.5));
            const [currentIndex, setCurrentIndex] = useState(0);
            const [options, setOptions] = useState([]);
            const [score, setScore] = useState(0);
            const [finished, setFinished] = useState(false);
            const [selectedId, setSelectedId] = useState(null);

            // Générer les options
            useEffect(() => {
                if (finished || queue.length === 0) return;
                const current = queue[currentIndex];
                const correctAnswer = isReversed ? current.front : current.back;
                
                // Prendre 3 autres réponses au hasard
                let wrongOptions = cards.filter(c => c !== current).sort(() => Math.random() - 0.5).slice(0, 3);
                wrongOptions = wrongOptions.map(c => isReversed ? c.front : c.back);
                
                const allOptions = [correctAnswer, ...wrongOptions].sort(() => Math.random() - 0.5);
                setOptions(allOptions);
                setSelectedId(null);
            }, [currentIndex, queue, finished]);

            const handleSelect = (option) => {
                if (selectedId !== null) return; // Déjà répondu
                setSelectedId(option);
                
                const isCorrect = option === (isReversed ? queue[currentIndex].front : queue[currentIndex].back);
                if (isCorrect) setScore(score + 1);

                setTimeout(() => {
                    if (currentIndex + 1 < queue.length) {
                        setCurrentIndex(currentIndex + 1);
                    } else {
                        setFinished(true);
                    }
                }, 1000); // Pause pour voir la couleur
            };

            if (finished) {
                return (
                    <div className="text-center p-8 bg-white dark:bg-slate-800 rounded-3xl shadow mt-8">
                        <h2 className="text-2xl font-bold mb-4">Quiz Terminé !</h2>
                        <p className="text-xl mb-6 text-brand-600 dark:text-brand-400 font-bold">{score} / {queue.length}</p>
                        <button onClick={() => { setQueue([...cards].sort(() => Math.random() - 0.5)); setCurrentIndex(0); setScore(0); setFinished(false); }} className="w-full py-3 bg-slate-200 dark:bg-slate-700 rounded-xl font-bold">Rejouer</button>
                    </div>
                );
            }

            const currentCard = queue[currentIndex];
            const questionText = isReversed ? currentCard.back : currentCard.front;

            return (
                <div className="w-full mt-4 flex flex-col items-center">
                    <p className="text-slate-500 mb-4 font-medium">Question {currentIndex + 1} / {queue.length}</p>
                    <div className="w-full bg-white dark:bg-slate-800 rounded-3xl p-8 shadow-sm border border-slate-200 dark:border-slate-700 text-center mb-6 relative">
                        <button onClick={() => onPlayAudio(questionText, isReversed ? 'fr' : 'es')} className="absolute top-4 right-4 p-2 text-slate-400 hover:text-brand-500 rounded-full transition"><Icons.Volume/></button>
                        <h2 className="text-3xl font-bold text-slate-800 dark:text-white mt-4">{questionText}</h2>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full">
                        {options.map((opt, i) => {
                            const isCorrectAnswer = opt === (isReversed ? currentCard.front : currentCard.back);
                            let btnClass = "bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 hover:border-brand-500 dark:hover:border-brand-500 text-slate-700 dark:text-slate-200";
                            
                            if (selectedId !== null) {
                                if (isCorrectAnswer) btnClass = "bg-green-100 dark:bg-green-900 border-green-500 text-green-800 dark:text-green-100";
                                else if (selectedId === opt) btnClass = "bg-red-100 dark:bg-red-900 border-red-500 text-red-800 dark:text-red-100";
                            }

                            return (
                                <button key={i} onClick={() => handleSelect(opt)} disabled={selectedId !== null} className={`p-4 rounded-2xl font-bold text-lg transition-all ${btnClass}`}>
                                    {opt}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // 3. CLAVIER (Orthographe)
        const TypingMode = ({ cards, isReversed, onPlayAudio }) => {
            const [queue, setQueue] = useState([...cards].sort(() => Math.random() - 0.5));
            const [currentIndex, setCurrentIndex] = useState(0);
            const [input, setInput] = useState('');
            const [status, setStatus] = useState('typing'); // 'typing', 'correct', 'wrong', 'reveal'
            const [finished, setFinished] = useState(false);

            const currentCard = queue[currentIndex];
            const questionText = isReversed ? currentCard.back : currentCard.front;
            const answerText = isReversed ? currentCard.front : currentCard.back;

            const checkAnswer = (e) => {
                e.preventDefault();
                if (status !== 'typing') {
                    // Passage à la suivante
                    if (currentIndex + 1 < queue.length) {
                        setCurrentIndex(currentIndex + 1);
                        setInput('');
                        setStatus('typing');
                    } else {
                        setFinished(true);
                    }
                    return;
                }

                // Vérification souple (minuscules, sans espaces en trop)
                const cleanInput = input.trim().toLowerCase();
                const cleanAnswer = answerText.trim().toLowerCase();

                if (cleanInput === cleanAnswer) {
                    setStatus('correct');
                } else {
                    setStatus('wrong');
                }
            };

            if (finished) return (
                <div className="text-center p-8 bg-white dark:bg-slate-800 rounded-3xl shadow mt-8"><h2 className="text-2xl font-bold mb-4">Exercice Terminé !</h2><button onClick={() => { setQueue([...cards].sort(() => Math.random() - 0.5)); setCurrentIndex(0); setInput(''); setStatus('typing'); setFinished(false); }} className="w-full py-3 bg-brand-500 text-white rounded-xl font-bold">Rejouer</button></div>
            );

            return (
                <div className="w-full mt-4 flex flex-col items-center max-w-md mx-auto">
                    <p className="text-slate-500 mb-4 font-medium">{currentIndex + 1} / {queue.length}</p>
                    <div className="w-full bg-white dark:bg-slate-800 rounded-t-3xl p-8 shadow-sm border border-slate-200 dark:border-slate-700 text-center relative border-b-0">
                        <button onClick={() => onPlayAudio(questionText, isReversed ? 'fr' : 'es')} className="absolute top-4 right-4 text-slate-400"><Icons.Volume/></button>
                        <h2 className="text-3xl font-bold text-slate-800 dark:text-white mt-4">{questionText}</h2>
                    </div>

                    <form onSubmit={checkAnswer} className="w-full">
                        <input 
                            type="text" autoFocus value={input} onChange={e => setInput(e.target.value)} disabled={status !== 'typing'}
                            placeholder="Tapez la traduction ici..."
                            className={`w-full p-6 text-xl text-center outline-none border-2 transition-colors rounded-b-3xl
                                ${status === 'typing' ? 'bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-700 focus:border-brand-500' : ''}
                                ${status === 'correct' ? 'bg-green-100 border-green-500 text-green-800 dark:bg-green-900 dark:text-green-100' : ''}
                                ${status === 'wrong' || status === 'reveal' ? 'bg-red-100 border-red-500 text-red-800 dark:bg-red-900 dark:text-red-100' : ''}
                            `}
                        />
                        
                        {status === 'wrong' && (
                            <div className="mt-4 p-4 bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-700 rounded-xl text-center">
                                <p className="text-sm text-amber-700 dark:text-amber-400">La bonne réponse était :</p>
                                <p className="text-xl font-bold text-amber-800 dark:text-amber-300">{answerText}</p>
                            </div>
                        )}

                        <button type="submit" className="w-full mt-6 py-4 bg-brand-600 hover:bg-brand-700 text-white rounded-2xl font-bold text-lg shadow-lg">
                            {status === 'typing' ? 'Vérifier' : 'Continuer'}
                        </button>
                        {status === 'typing' && (
                            <button type="button" onClick={() => setStatus('reveal')} className="w-full mt-3 py-2 text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 font-medium">
                                Je ne sais pas
                            </button>
                        )}
                    </form>
                </div>
            );
        };

        // 4. JEU DE MÉMOIRE (Paires)
        const MemoryMode = ({ cards }) => {
            const [tiles, setTiles] = useState([]);
            const [flipped, setFlipped] = useState([]);
            const [matched, setMatched] = useState([]);

            useEffect(() => {
                // Prendre max 6 cartes pour faire 12 tuiles (rentre sur mobile)
                const selectedCards = [...cards].sort(() => Math.random() - 0.5).slice(0, 6);
                const newTiles = [];
                selectedCards.forEach((c, index) => {
                    newTiles.push({ id: `f-${index}`, matchId: index, text: c.front, lang: 'es' });
                    newTiles.push({ id: `b-${index}`, matchId: index, text: c.back, lang: 'fr' });
                });
                setTiles(newTiles.sort(() => Math.random() - 0.5));
                setFlipped([]);
                setMatched([]);
            }, [cards]);

            const handleTileClick = (index) => {
                if (flipped.length >= 2 || flipped.includes(index) || matched.includes(tiles[index].matchId)) return;
                
                const newFlipped = [...flipped, index];
                setFlipped(newFlipped);

                if (newFlipped.length === 2) {
                    const matchId1 = tiles[newFlipped[0]].matchId;
                    const matchId2 = tiles[newFlipped[1]].matchId;
                    if (matchId1 === matchId2) {
                        setTimeout(() => {
                            setMatched([...matched, matchId1]);
                            setFlipped([]);
                        }, 500);
                    } else {
                        setTimeout(() => setFlipped([]), 1000);
                    }
                }
            };

            if (matched.length === tiles.length / 2 && tiles.length > 0) {
                return (
                    <div className="text-center p-8 bg-white dark:bg-slate-800 rounded-3xl shadow mt-8">
                        <h2 className="text-3xl font-bold mb-4 text-green-500">Gagné ! 🏆</h2>
                        <button onClick={() => setTiles([])} className="w-full py-3 bg-brand-500 text-white rounded-xl font-bold">Nouveau plateau</button>
                    </div>
                );
            }

            return (
                <div className="w-full mt-4">
                    <p className="text-center text-slate-500 mb-6 font-medium">Associe chaque mot à sa traduction !</p>
                    <div className="grid grid-cols-3 sm:grid-cols-4 gap-3">
                        {tiles.map((tile, i) => {
                            const isFlipped = flipped.includes(i) || matched.includes(tile.matchId);
                            const isMatched = matched.includes(tile.matchId);
                            
                            return (
                                <div key={i} onClick={() => handleTileClick(i)} 
                                    className={`relative h-24 sm:h-32 cursor-pointer perspective-1000 ${isMatched ? 'opacity-0 cursor-default' : ''} transition-opacity duration-500`}>
                                    <div className={`w-full h-full card-transition transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                                        <div className="absolute w-full h-full backface-hidden bg-white dark:bg-slate-800 rounded-xl shadow border-2 border-slate-200 dark:border-slate-700 flex items-center justify-center">
                                            <span className="text-3xl text-slate-300">?</span>
                                        </div>
                                        <div className="absolute w-full h-full backface-hidden bg-brand-100 dark:bg-brand-900 border-2 border-brand-300 dark:border-brand-600 rounded-xl shadow flex items-center justify-center p-2 text-center rotate-y-180">
                                            <span className="text-sm sm:text-base font-bold text-brand-800 dark:text-brand-100 leading-tight">{tile.text}</span>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };


        // ==========================================
        // APPLICATION PRINCIPALE
        // ==========================================
        function App() {
            // -- Mode Global --
            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('theme') === 'dark');
            const [activeTab, setActiveTab] = useState('flashcards'); // flashcards, qcm, typing, memory, create
            
            // -- Data --
            const [customLists, setCustomLists] = useState(() => {
                const saved = localStorage.getItem('polyglot_lists');
                return saved ? JSON.parse(saved) : {};
            });
            const [activeCategory, setActiveCategory] = useState("Tout le vocabulaire");
            const [isReversed, setIsReversed] = useState(false);

            // -- Création & Export --
            const [newListName, setNewListName] = useState("");
            const [rawInput, setRawInput] = useState("");
            const [exportString, setExportString] = useState("");

            // Appliquer le dark mode au body
            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                }
            }, [darkMode]);

            // Sauvegarde des listes
            useEffect(() => {
                localStorage.setItem('polyglot_lists', JSON.stringify(customLists));
            }, [customLists]);

            // Récupérer les cartes actuelles
            const currentCards = useMemo(() => {
                if (activeCategory === "Tout le vocabulaire") return ALL_VOCABULARY;
                if (VOCABULARY_DB[activeCategory]) return VOCABULARY_DB[activeCategory];
                if (customLists[activeCategory]) return customLists[activeCategory];
                return ALL_VOCABULARY;
            }, [activeCategory, customLists]);

            // Audio TTS
            const playAudio = (text, lang) => {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang === 'es' ? 'es-ES' : 'fr-FR';
                window.speechSynthesis.speak(utterance);
            };

            // Actions Import/Création
            const handleCreate = () => {
                if (!newListName.trim()) return alert("Donne un nom à ta liste !");
                const lines = rawInput.split('\n');
                const newCards = [];
                lines.forEach(line => {
                    if (!line.trim()) return;
                    let parts = line.split('\t');
                    if (parts.length < 2) parts = line.split(' - ');
                    if (parts.length < 2) parts = line.split('-');
                    if (parts.length < 2) parts = line.split(':');
                    if (parts.length >= 2) newCards.push({ front: parts[0].trim(), back: parts[1].trim() });
                });
                if (newCards.length > 0) {
                    const name = newListName.trim();
                    setCustomLists(prev => ({ ...prev, [name]: newCards }));
                    setActiveCategory(name);
                    setNewListName(""); setRawInput(""); setActiveTab('flashcards');
                    alert(`Liste "${name}" créée avec ${newCards.length} mots !`);
                } else {
                    alert("Format invalide. Utilise des tirets (-) entre le mot et la traduction.");
                }
            };

            const handleExport = () => {
                const dataStr = JSON.stringify(customLists);
                const base64 = btoa(unescape(encodeURIComponent(dataStr))); // Sécuriser les accents
                setExportString(base64);
            };

            const handleImport = () => {
                try {
                    const decoded = decodeURIComponent(escape(atob(exportString)));
                    const importedLists = JSON.parse(decoded);
                    if (typeof importedLists === 'object') {
                        setCustomLists({ ...customLists, ...importedLists });
                        setExportString("");
                        alert("Listes importées avec succès !");
                    }
                } catch (e) {
                    alert("Code d'import invalide !");
                }
            };

            return (
                <div className="max-w-2xl mx-auto min-h-screen flex flex-col pb-24">
                    
                    {/* EN-TÊTE */}
                    <header className="p-4 flex justify-between items-center bg-white dark:bg-slate-800 shadow-sm sticky top-0 z-10">
                        <div className="flex items-center gap-2 text-brand-600 dark:text-brand-400">
                            <Icons.Book />
                            <h1 className="font-extrabold text-xl tracking-tight">Polyglot</h1>
                        </div>
                        <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition">
                            {darkMode ? <Icons.Sun /> : <Icons.Moon />}
                        </button>
                    </header>

                    <main className="flex-1 p-4 w-full">
                        
                        {/* SELECTEUR DE LISTE (Caché si on crée une liste) */}
                        {activeTab !== 'create' && (
                            <div className="mb-6 flex gap-2">
                                <select value={activeCategory} onChange={(e) => setActiveCategory(e.target.value)}
                                    className="flex-1 pl-4 pr-10 py-3 rounded-2xl bg-white dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700 focus:ring-brand-500 font-bold text-slate-700 dark:text-slate-200 outline-none appearance-none cursor-pointer">
                                    <optgroup label="Listes par défaut">
                                        <option value="Tout le vocabulaire">📚 Tout le vocabulaire ({ALL_VOCABULARY.length})</option>
                                        {Object.keys(VOCABULARY_DB).map(c => <option key={c} value={c}>{c} ({VOCABULARY_DB[c].length})</option>)}
                                    </optgroup>
                                    {Object.keys(customLists).length > 0 && (
                                        <optgroup label="Mes Listes">
                                            {Object.keys(customLists).map(c => <option key={c} value={c}>💾 {c} ({customLists[c].length})</option>)}
                                        </optgroup>
                                    )}
                                </select>
                                
                                <button onClick={() => setIsReversed(!isReversed)} className="p-3 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 text-brand-600 dark:text-brand-400 font-bold flex items-center gap-1">
                                    {isReversed ? 'FR' : 'ES'} <Icons.Rotate/>
                                </button>
                            </div>
                        )}

                        {/* CONTENU SELON L'ONGLET */}
                        {activeTab === 'flashcards' && <FlashcardMode cards={currentCards} isReversed={isReversed} onPlayAudio={playAudio} key={`fc-${activeCategory}-${isReversed}`} />}
                        {activeTab === 'qcm' && <QcmMode cards={currentCards} isReversed={isReversed} onPlayAudio={playAudio} key={`qcm-${activeCategory}-${isReversed}`} />}
                        {activeTab === 'typing' && <TypingMode cards={currentCards} isReversed={isReversed} onPlayAudio={playAudio} key={`typ-${activeCategory}-${isReversed}`} />}
                        {activeTab === 'memory' && <MemoryMode cards={currentCards} key={`mem-${activeCategory}`} />}
                        
                        {/* ONGLET CREATION / PARAMETRES */}
                        {activeTab === 'create' && (
                            <div className="space-y-8 animate-in fade-in">
                                
                                {/* Créer une liste */}
                                <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700">
                                    <h2 className="text-xl font-bold mb-4 flex items-center gap-2"><Icons.Edit/> Nouvelle Liste</h2>
                                    <input type="text" value={newListName} onChange={e => setNewListName(e.target.value)} placeholder="Nom (ex: Verbes)" className="w-full p-4 mb-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 outline-none focus:border-brand-500 font-bold" />
                                    <textarea value={rawInput} onChange={e => setRawInput(e.target.value)} placeholder="Mot - Traduction&#10;Perro - Chien" className="w-full h-40 p-4 mb-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 outline-none focus:border-brand-500 font-mono text-sm resize-y" />
                                    <button onClick={handleCreate} className="w-full py-4 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold shadow-md">Sauvegarder la liste</button>
                                </div>

                                {/* Import / Export */}
                                <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700">
                                    <h2 className="text-xl font-bold mb-4 flex items-center gap-2">🔄 Partager / Importer</h2>
                                    <p className="text-sm text-slate-500 mb-4">Génère un code pour envoyer tes listes personnalisées sur ton téléphone ou à un ami.</p>
                                    
                                    <div className="flex gap-2 mb-4">
                                        <button onClick={handleExport} className="flex-1 py-3 bg-slate-200 dark:bg-slate-700 rounded-xl font-bold hover:bg-slate-300 dark:hover:bg-slate-600">Générer le code</button>
                                        <button onClick={handleImport} className="flex-1 py-3 bg-slate-200 dark:bg-slate-700 rounded-xl font-bold hover:bg-slate-300 dark:hover:bg-slate-600 text-brand-600 dark:text-brand-400">Importer le code</button>
                                    </div>
                                    
                                    <textarea value={exportString} onChange={e => setExportString(e.target.value)} placeholder="Colle un code secret ici pour importer, ou génère-le pour exporter..." className="w-full h-24 p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 outline-none text-xs font-mono break-all" />
                                </div>

                            </div>
                        )}
                    </main>

                    {/* BARRE DE NAVIGATION EN BAS (Mobile-friendly) */}
                    <nav className="fixed bottom-0 w-full max-w-2xl bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 flex justify-around p-2 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                        {[
                            { id: 'flashcards', icon: <Icons.Cards/>, label: 'Cartes' },
                            { id: 'qcm', icon: <Icons.List/>, label: 'QCM' },
                            { id: 'typing', icon: <Icons.Keyboard/>, label: 'Clavier' },
                            { id: 'memory', icon: <Icons.Grid/>, label: 'Paires' },
                            { id: 'create', icon: <Icons.Edit/>, label: 'Créer' }
                        ].map(tab => (
                            <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex flex-col items-center p-2 min-w-[60px] rounded-xl transition-all ${activeTab === tab.id ? 'text-brand-600 dark:text-brand-400 bg-brand-50 dark:bg-brand-900/30' : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300'}`}>
                                {tab.icon}
                                <span className="text-[10px] font-bold mt-1">{tab.label}</span>
                            </button>
                        ))}
                    </nav>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
